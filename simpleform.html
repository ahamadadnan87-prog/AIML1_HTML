<html>
<head>
    <title>Simple Form</title>
</head>
<body bgcolor="lightblue" align="center">
    <h1><marquee behavior="alternate" direction="left" scrollamount="10"><font color="blue">Welcome to the Registration Form</font></marquee></h1>
    <IMG SRC="file:///C:/Users/Adnan%20Ahamad/Desktop/imazes/abes%20logo.webp" WIDTH="180" HEIGHT="180" align="center">
    <h2><font color="blue">Registration Form</font></h2>
    <form>
        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label>Gender:</label>
        <input type="radio"  name="gender" id="male">
        <label for="male">Male</label>
        <input type="radio"  name="gender">
        <label for="female">Female</label><br><br>

        <label>Course:</label>
        <select name="course">
            <option >Btech</option>
            <option >Mtech</option>
            <option >BBA</option>
            <option >BCA</option>
            <option >MBA</option>
        </select>
        <p>Message:<br>
            <textarea name="message"></textarea>
        </p>
        <input type="submit" value="Submit">
        <input type="Reset" value="Reset">
    </form>
</body>
</html>
